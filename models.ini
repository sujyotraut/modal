[*]
jinja = true
flash-attn = on
cache-reuse = 512
cache-type-k = q8_0
cache-type-v = q8_0
; NOTE: turbo quant is experimental
; cache-type-v = turbo4
n-gpu-layers = all
; FIXME: In theory, `kv-unified` slows down if slot's are idle on cuda.
; In practice, in llama.cpp latest build (b8658+) add cache-idle-slots to avoid it.
kv-unified = on

[Qwen3.8-27B]
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
; Speculative Decoding
hfd = z-lab/Qwen3.8-27B-DFlash2-GGUF:Q4_K_M
spec-type = draft-dflash
spec-draft-n-max = 7
; Context Extension
rope-scaling = yarn
rope-scale = 2.0
yarn-orig-ctx = 262144
ctx-size = 524288
; Sampling Parameters
temperature = 1
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

